name: PR-Agent review
on:
  workflow_call:
    secrets:
      ANTHROPIC_KEY:
        required: true

jobs:
  pr-agent-job:
    if: ${{ github.event.sender.type != 'Bot' && ! startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-latest

    concurrency:
      group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    permissions:
      issues: write
      pull-requests: write
      contents: read

    name: Run pr agent auto code review
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          anthropic.key: ${{ secrets.ANTHROPIC_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # An unset auto_* flag means enabled, so every action has to be switched off explicitly.
          github_action_config.auto_improve: "false"
          github_action_config.auto_review: "false"
          github_action_config.auto_describe: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'

          pr_reviewer.enable_review_labels_effort: false
          pr_reviewer.final_update_message: false

          # /review asks for the regular model, /describe for the weak one
          # (pr_reviewer.py ModelType.REGULAR, pr_description.py ModelType.WEAK),
          # so the harder job gets the stronger model and summarising stays cheap.
          config.model: "anthropic/claude-opus-5"
          config.model_weak: "anthropic/claude-sonnet-5"
          # Matches the primary so a run fails instead of escalating to a pricier model.
          config.fallback_models: "anthropic/claude-opus-5"
